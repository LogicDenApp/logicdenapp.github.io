<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Random – LogicDen</title>
<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --line: #e5e9ee;
    --ink: #0f172a;
    --muted: #5b6573;
    --teal: #0f766e;
    --teal-tint: #e1f2ee;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 8px; }

  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  .site-header { background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 84px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 22px; font-weight: 800;
  }
  .nav { display: flex; gap: 36px; font-size: 18px; color: var(--muted); }
  .nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }

  /* Page */
  main { flex: 1; padding: 48px 0 72px; }
  .top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
  .back { display: inline-block; font-size: 16px; color: var(--muted); margin-bottom: 14px; }
  .back:hover { color: var(--ink); }
  h1 { margin: 0; font-size: clamp(36px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; }
  .sub { margin: 12px 0 0; font-size: 20px; color: var(--muted); }

  .btn {
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    border-radius: 14px; border: 1px solid transparent; padding: 14px 24px;
    transition: background-color .15s, border-color .15s;
  }
  .btn-dark { background: var(--ink); color: #fff; }
  .btn-dark:hover { background: #1e293b; }
  .btn-light { background: var(--surface); color: var(--ink); border-color: var(--line); padding: 10px 18px; font-size: 15px; font-weight: 500; }
  .btn-light:hover { border-color: #c9d1da; }

  /* Player */
  .player {
    position: relative; background: var(--teal-tint); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; width: 100%;
  }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .start { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; }
  .start .letter { font-size: 96px; font-weight: 800; color: var(--teal); line-height: 1; }
  .start .btn { font-size: 20px; padding: 16px 40px; }
  .player-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
  .player-bar span { color: var(--muted); font-size: 16px; }

  /* Footer */
  .site-footer { background: var(--surface); border-top: 1px solid var(--line); }
  .site-footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 130px; flex-wrap: wrap; color: var(--muted); }
  .foot-right { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

  @media (max-width: 720px) {
    .nav { gap: 20px; font-size: 16px; }
    .brand { font-size: 24px; }
    .site-header .wrap { height: 72px; }
    .start .letter { font-size: 64px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../../index.html">
      <span class="brand-mark">L</span> LogicDen
    </a>
    <nav class="nav" aria-label="Main">
      <a href="../../index.html#calculator">Calculator</a>
      <a href="../../index.html#tools">Tools</a>
      <a href="../../index.html#games" aria-current="page">Games</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="top-row">
      <div>
        <a class="back" href="../../index.html#games">&larr; Back to games</a>
        <h1 id="game-title">Soccer Random</h1>
        <p class="sub" id="game-sub">Runs right in your browser.</p>
      </div>
      <a class="btn btn-dark" href="../../index.html#games">All Games</a>
    </div>

    <div class="player" id="player">
      <div class="start" id="start">
        <div class="letter" id="game-letter">S</div>
        <button class="btn btn-dark" id="play">Play</button>
      </div>
    </div>

    <div class="player-bar">
      <span>Click inside the game first so the keyboard works.</span>
      <button class="btn btn-light" id="fs">Fullscreen</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>LogicDen</span>
    <div class="foot-right">
      <span>Free calculators and math tools</span>
      <button class="btn btn-light" id="disguise">Disguise tab</button>
    </div>
  </div>
</footer>

<script>
  /* ===== EDIT THESE PER GAME ===== */
  const GAME = {
    title: "Soccer Random",
    // Path to the raw game's entry file, relative to this page.
    // Example: "game/index.html" or "index2.html"
    src: "game/index.html"
  };
  /* =============================== */

  document.title = GAME.title + " – LogicDen";
  document.getElementById("game-title").textContent = GAME.title;
  document.getElementById("game-letter").textContent = GAME.title.charAt(0).toUpperCase();

  const player = document.getElementById("player");

  document.getElementById("play").addEventListener("click", () => {
    const frame = document.createElement("iframe");
    frame.src = GAME.src;
    frame.title = GAME.title;
    frame.allow = "fullscreen; autoplay; gamepad";
    frame.allowFullscreen = true;
    document.getElementById("start").remove();
    player.appendChild(frame);
    frame.focus();
  });

  document.getElementById("fs").addEventListener("click", () => {
    if (player.requestFullscreen) player.requestFullscreen();
  });

  /* Disguise tab: swaps the tab title and icon. Click again to restore. */
  const realTitle = document.title;
  const icon = document.querySelector("link[rel~='icon']") || document.head.appendChild(
    Object.assign(document.createElement("link"), { rel: "icon" })
  );
  const realIcon = icon.href;
  const fakeIcon = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234285f4'/><rect x='8' y='7' width='16' height='18' rx='2' fill='white'/></svg>"
      .replace("%23", "#")
  );
  let disguised = false;
  document.getElementById("disguise").addEventListener("click", () => {
    disguised = !disguised;
    document.title = disguised ? "Untitled document - Google Docs" : realTitle;
    icon.href = disguised ? fakeIcon : realIcon;
  });

  /* Quick hide: press ` (backtick) to jump back to the calculator page. */
  document.addEventListener("keydown", (e) => {
    if (e.key === "`") window.location.replace("../../index.html");
  });
</script>
</body>
</html>
